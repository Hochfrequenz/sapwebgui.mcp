name: "Packaging Test"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  check_packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
      - name: Build package
        run: uv build
      - name: Check package
        run: uv publish --dry-run dist/*
  check_docker_build:
    # Builds the image without pushing it, so a broken Dockerfile is caught before a release.
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sapwebgui-mcp:ci
      - name: Check entry point and import
        run: |
          docker run --rm --entrypoint sh sapwebgui-mcp:ci -c 'command -v run-sapwebgui-mcp-server'
          docker run --rm --entrypoint python sapwebgui-mcp:ci -c "import sapwebguimcp.server"
