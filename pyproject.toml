[project]
name = "sapwebguimcp"
description = "MCP server for SAP Web GUI browser automation"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+pip@hochfrequenz.de" }]
keywords = ["mcp", "sap", "webgui", "browser", "automation", "playwright", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "fastmcp[apps]>=4.0.3,<5.0.0",  # v4 required: snake_case ToolAnnotations (mcp 2.x) and InputRequiredResult (SEP-2322)
    "httpx>=0.27.0",  # HTTP client for GitHub API (feedback issue handler)
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rapidfuzz>=3.0.0",  # Fuzzy string matching for catalog search
    "sap-mcp-config>=2.0.0,<3",  # Shared SAP system credentials config. 2.0.0 for the required `supported_languages` argument: sapwebguimcp passes its supported languages (lang.supported_languages()), so an unsupported language in systems.json fails at load time (Hochfrequenz/sap-mcp-config#37 for ${env:VAR} placeholders, available since 1.1.0).
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/sapwebgui.mcp/releases"
Homepage = "https://github.com/Hochfrequenz/sapwebgui.mcp"

[dependency-groups]
tests = [
    "pytest==9.2.0",
    "anyio==4.16.0",  # includes pytest-anyio plugin for proper async fixture teardown
    "python-dotenv>=1.0.0",
    "beautifulsoup4==4.15.0",  # HTML parsing for selector unit tests
    "lxml==6.1.3",  # Fallback parser for Python 3.13+ (html.parser has stricter nesting rules)
    "respx==0.23.1",  # Mock httpx requests in tests
    "pillow==13.0.0",  # README demo composite renderer (layout-math unit tests import it)
]
linting = [
    "ruff==0.17.5",
]
type_check = [
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20260518",
    { include-group = "tests" },
]
spell_check = [
    "codespell==2.4.3",
]
coverage = [
    "coverage==7.17.3",
    { include-group = "tests" },
]
build_executable = [
    "pyinstaller==6.22.3",
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "spell_check" },
    { include-group = "coverage" },
]

[tool.uv]
default-groups = []

[project.scripts]
run-sapwebgui-mcp-server = "sapwebguimcp.server:main"

[tool.ruff]
line-length = 120
target-version = "py311"  # matches requires-python floor
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle-error
    "W",   # pycodestyle-warning
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "PL",  # pylint
    "RUF", # ruff-specific-rules
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "TC",  # flake8-type-checking
    "S",   # flake8-bandit
    "PIE", # flake8-pie
    "RSE", # flake8-raise
    "ISC", # flake8-implicit-str-concat
]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with `ruff format`)
]

[tool.ruff.lint.isort]
known-first-party = ["sapwebguimcp"]
known-third-party = ["sap_mcp_config"]

[tool.ruff.lint.per-file-ignores]
# Tests: assertions are the point of a test suite (PLR2004 is already ignored globally).
"unittests/**" = [
    "S101", # assert
]

